name: Release

# Bump `version:` in build.yaml and push to main -> release v<version> is
# created (if it doesn't exist yet) with the zip and manifest.json attached.
on:
  push:
    branches: [ main ]
    paths: [ build.yaml ]
  workflow_dispatch:

permissions:
  contents: write   # required to upload release assets

env:
  DLL: Jellyfin.Plugin.WledTv
  GUID: a4b5c6d7-e8f9-4a3b-8c7d-e6f5a4b3c2d1

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Extract version from build.yaml
        id: ver
        run: |
          VERSION=$(grep '^version:' build.yaml | grep -oP '"[^"]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Baking version $VERSION into assembly"

      # ONE build serves every supported Jellyfin. Compiled net9.0 against the
      # oldest supported packages (10.11); Jellyfin's assemblies are not
      # strong-named, so this binds on Jellyfin 12 too (proven by compat-check.yml).
      - name: Build
        run: |
          dotnet build --configuration Release -p:JellyfinVersion=10.11.10 \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:AssemblyVersion=${{ steps.ver.outputs.version }} \
            -p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd bin/Release/net9.0 && zip -q "$GITHUB_WORKSPACE/dist/${DLL}.zip" "${DLL}.dll")
          (cd dist && md5sum "${DLL}.zip" | awk '{print $1}' > "${DLL}.zip.md5")
          ls -l dist

      - name: Create release for tag (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.ver.outputs.tag }}" --title "${{ steps.ver.outputs.tag }}" --target "${{ github.sha }}" --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" dist/* build.yaml --clobber

      # Public repo: the manifest points at this release's GitHub downloads.
      # Private repo: Jellyfin cannot download anonymously, so set the repository
      # variable PLUGIN_BASE_URL to a LAN mirror of the release assets.
      - name: Build manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          BASE_URL: ${{ vars.PLUGIN_BASE_URL || format('https://github.com/{0}/releases/download/{1}', github.repository, steps.ver.outputs.tag) }}
        run: |
          set -euo pipefail
          export CHANGELOG="$(gh release view "$TAG" --json body --jq .body)"
          export TARGET_ABI="$(grep '^targetAbi:' build.yaml | sed 's/^targetAbi:[[:space:]]*//; s/^"//; s/"$//')"
          export PNAME="$(grep '^name:' build.yaml | sed 's/^name:[[:space:]]*//; s/^"//; s/"$//')"
          export PDESC="$(grep '^description:' build.yaml | sed 's/^description:[[:space:]]*//; s/^"//; s/"$//')"
          export POWNER="$(grep '^owner:' build.yaml | sed 's/^owner:[[:space:]]*//; s/^"//; s/"$//')"
          export PCATEGORY="$(grep '^category:' build.yaml | sed 's/^category:[[:space:]]*//; s/^"//; s/"$//')"
          export PIMAGE="$(grep '^imageUrl:' build.yaml | sed 's/^imageUrl:[[:space:]]*//; s/^"//; s/"$//')"
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          dll, base = os.environ["DLL"], os.environ["BASE_URL"].rstrip("/")
          asset = f"{dll}.zip"
          data = [{
              "category": os.environ["PCATEGORY"],
              "description": os.environ["PDESC"],
              "guid": os.environ["GUID"],
              "imageUrl": os.environ["PIMAGE"],
              "name": os.environ["PNAME"],
              "overview": os.environ["PDESC"],
              "owner": os.environ["POWNER"],
              "versions": [{
                  "changelog": os.environ.get("CHANGELOG", "") or "",
                  "checksum": hashlib.md5(pathlib.Path("dist", asset).read_bytes()).hexdigest(),
                  "sourceUrl": f"{base}/{asset}",
                  "targetAbi": os.environ["TARGET_ABI"],
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "version": os.environ["VERSION"],
              }],
          }]
          pathlib.Path("dist/manifest.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.ver.outputs.tag }}" dist/manifest.json --clobber
